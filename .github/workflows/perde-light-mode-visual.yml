name: Perde Light Mode Visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "admin.html"
      - "assets/css/**"
      - "assets/js/themes/**"
      - "tests/perde-light-mode-smoke.mjs"
      - ".github/workflows/perde-light-mode-visual.yml"
  workflow_dispatch:

concurrency:
  group: perde-light-mode-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  light-mode-browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Start local Perde preview
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/perde-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/perde-http.log
          exit 1

      - name: Test light and dark themes on desktop and mobile
        run: node tests/perde-light-mode-smoke.mjs

      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perde-light-mode-visual-qa
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
